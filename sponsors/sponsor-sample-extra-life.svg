<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <linearGradient id="bgEL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#112240" />
    </linearGradient>
    <linearGradient id="elCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00ADEF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="elBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <rect width="396" height="146" x="2" y="2" rx="14" fill="url(#bgEL)" stroke="url(#elBorder)" stroke-width="2.5" />
  <!-- Emblem: Controller with heart/plus -->
  <g transform="translate(34, 38)">
    <rect x="5" y="8" width="66" height="52" rx="15" fill="#0369a1" fill-opacity="0.35" stroke="#38BDF8" stroke-width="2" />
    <!-- Plus symbol in center -->
    <rect x="33" y="24" width="10" height="20" rx="3" fill="#F8FAFC" />
    <rect x="28" y="29" width="20" height="10" rx="3" fill="#F8FAFC" />
  </g>
  <!-- Text Block -->
  <text x="135" y="62" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" font-weight="900" fill="url(#elCyan)" letter-spacing="1">EXTRA LIFE GUILD</text>
  <text x="135" y="86" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#BAE6FD" letter-spacing="2">PLAY GAMES • HEAL KIDS</text>
  <rect x="135" y="98" width="90" height="3" rx="1.5" fill="#00ADEF" fill-opacity="0.7" />
</svg>
