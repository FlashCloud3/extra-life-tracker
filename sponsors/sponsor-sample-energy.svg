    <path d="M 38 18 L 22 45 L 34 45 L 30 72 L 48 43 L 36 43 Z" fill="#34D399" stroke="#A7F3D0" stroke-width="1.5" stroke-linejoin="round" />
  </g>
  <!-- Text Block -->
  <text x="135" y="62" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="url(#neonGradient)" letter-spacing="1">PULSE ENERGY</text>
  <text x="135" y="86" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6EE7B7" letter-spacing="2">OFFICIAL ENERGY PARTNER</text>
  <rect x="135" y="98" width="90" height="3" rx="1.5" fill="#34D399" fill-opacity="0.7" />
