<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <linearGradient id="bgComm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e112a" />
      <stop offset="100%" stop-color="#2d1b3f" />
    </linearGradient>
    <linearGradient id="roseText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="roseBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <rect width="396" height="146" x="2" y="2" rx="14" fill="url(#bgComm)" stroke="url(#roseBorder)" stroke-width="2.5" />
  <!-- Emblem: Heart & Hands / Guild Shield -->
  <g transform="translate(36, 32)">
    <circle cx="35" cy="42" r="32" fill="#581c87" fill-opacity="0.3" stroke="#C084FC" stroke-width="2" />
    <!-- Heart Shape -->
    <path d="M 35 60 C 35 60 17 48 17 33 C 17 25 23 20 30 20 C 33 20 35 23 35 23 C 35 23 37 20 40 20 C 47 20 53 25 53 33 C 53 48 35 60 35 60 Z" fill="#F472B6" />
  </g>
  <!-- Text Block -->
  <text x="135" y="62" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="url(#roseText)" letter-spacing="1">HEROES FOR HEALTH</text>
  <text x="135" y="86" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#E9D5FF" letter-spacing="2">COMMUNITY CHARITY PARTNER</text>
  <rect x="135" y="98" width="90" height="3" rx="1.5" fill="#F472B6" fill-opacity="0.7" />
</svg>
