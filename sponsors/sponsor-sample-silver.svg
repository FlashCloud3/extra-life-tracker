<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <linearGradient id="bgSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e2433" />
    </linearGradient>
    <linearGradient id="silverText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="silverBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <rect width="396" height="146" x="2" y="2" rx="14" fill="url(#bgSilver)" stroke="url(#silverBorder)" stroke-width="2.5" />
  <!-- Emblem: Controller -->
  <g transform="translate(32, 40)">
    <rect x="5" y="10" width="70" height="50" rx="16" fill="#334155" stroke="#CBD5E1" stroke-width="2.5" />
    <!-- D-pad -->
    <rect x="18" y="27" width="16" height="6" rx="2" fill="#94A3B8" />
    <rect x="23" y="22" width="6" height="16" rx="2" fill="#94A3B8" />
    <!-- Buttons -->
    <circle cx="56" cy="27" r="3.5" fill="#E2E8F0" />
    <circle cx="64" cy="35" r="3.5" fill="#E2E8F0" />
    <circle cx="48" cy="35" r="3.5" fill="#E2E8F0" />
    <circle cx="56" cy="43" r="3.5" fill="#E2E8F0" />
  </g>
  <!-- Text Block -->
  <text x="135" y="62" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="url(#silverText)" letter-spacing="1">NEXUS GAMING</text>
  <text x="135" y="86" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="2">SILVER STREAM PARTNER</text>
  <rect x="135" y="98" width="90" height="3" rx="1.5" fill="#CBD5E1" fill-opacity="0.6" />
</svg>
